<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON RACER — 霓虹狂飙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050f; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 10; font-variant-numeric: tabular-nums; }
  #topLeft { position: absolute; top: 16px; left: 22px; }
  #score { font-size: 36px; font-weight: 800; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 6px #0ff, 0 0 22px rgba(0,255,255,.55); }
  .miniRow { display: flex; gap: 14px; margin-top: 4px; font-size: 13px; color: #8fd8e8;
    text-shadow: 0 0 8px rgba(0,229,255,.5); letter-spacing: 1px; }
  #panel { position: absolute; top: 14px; right: 16px; width: 216px; padding: 12px 15px 13px;
    background: linear-gradient(160deg, rgba(10,14,32,.72), rgba(8,10,24,.5));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(0,255,255,.22); border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,229,255,.09), inset 0 0 24px rgba(0,229,255,.05); }
  .pTitle { font-size: 10px; letter-spacing: 4px; color: #58b7c9; margin: 11px 0 5px;
    border-bottom: 1px solid rgba(88,183,201,.18); padding-bottom: 4px; font-weight: 600; }
  .pTitle.first { margin-top: 0; }
  #tierName { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #0ff; text-shadow: 0 0 10px currentColor; }
  .barWrap { height: 5px; background: rgba(0,255,255,.12); border-radius: 3px; margin-top: 7px; overflow: hidden; }
  #tierBar { height: 100%; width: 0%; border-radius: 3px; transition: width .25s ease-out;
    background: linear-gradient(90deg, #00c8ff, #00ffc8); box-shadow: 0 0 10px #0ff; }
  .tiny { font-size: 10px; color: #4f8fa0; margin-top: 5px; letter-spacing: 1px; }
  .ab { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2.5px 0; color: #d8f6ff; letter-spacing: 1px; }
  .ab i { width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 35%, #baffff, #00e5ff); box-shadow: 0 0 8px #00e5ff; }
  .ab.locked { opacity: .26; filter: grayscale(.8); }
  .ab b { margin-left: auto; font-size: 10px; font-weight: 400; color: #7fe3d4; letter-spacing: 0; }
  .ab.ready i { animation: dotPulse 1.2s infinite alternate; }
  @keyframes dotPulse { from { box-shadow: 0 0 4px #00e5ff; } to { box-shadow: 0 0 14px #00e5ff; } }
  .drow { display: flex; justify-content: space-between; font-size: 12.5px; padding: 2.5px 0; color: #8fb6c4; letter-spacing: 1px; }
  .drow b { color: #fff; font-weight: 700; }
  #comboBox { position: absolute; top: 13%; width: 100%; text-align: center; font-weight: bold;
    font-size: clamp(30px, 5vw, 52px); letter-spacing: 3px; opacity: 0; transition: opacity .3s; }
  #comboBox.pop { animation: pop .22s ease-out; }
  @keyframes pop { 0% { transform: scale(1.55); } 100% { transform: scale(1); } }
  #comboBar { height: 4px; width: 130px; margin: 6px auto 0; border-radius: 2px; background: currentColor; box-shadow: 0 0 10px currentColor; }
  #toast { position: absolute; top: 30%; width: 100%; text-align: center; font-size: clamp(24px, 4vw, 40px);
    font-weight: bold; letter-spacing: 8px; opacity: 0; }
  #toast.show { animation: toastAnim 1.5s ease-out forwards; }
  @keyframes toastAnim {
    0% { opacity: 0; transform: scale(.5); }
    15% { opacity: 1; transform: scale(1.15); }
    28% { transform: scale(1); }
    78% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.05); }
  }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 12; opacity: 0; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 11; opacity: 0; transition: opacity .12s linear;
    box-shadow: inset 0 0 140px 50px var(--vc, #00ffff); }
  #score.bump { animation: bump .2s ease-out; }
  @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5, 5, 15, 0.75); backdrop-filter: blur(4px); z-index: 20; color: #fff; text-align: center; }
  .overlay.hidden { display: none; }
  h1 { font-size: clamp(40px, 9vw, 90px); letter-spacing: 12px; color: #0ff; text-shadow: 0 0 20px #0ff, 0 0 60px #08a; margin-bottom: 10px; animation: pulse 2s infinite alternate; }
  @keyframes pulse { from { opacity: .85; } to { opacity: 1; } }
  h2 { font-size: clamp(28px, 6vw, 54px); letter-spacing: 8px; color: #f0f; text-shadow: 0 0 20px #f0f; margin-bottom: 14px; }
  .sub { font-size: 17px; line-height: 1.9; color: #9beaff; margin-bottom: 30px; }
  .sub b { color: #fff; }
  .final { font-size: 26px; color: #0f0; text-shadow: 0 0 12px #0f0; margin-bottom: 26px; }
  button { pointer-events: auto; padding: 14px 52px; font-size: 20px; letter-spacing: 4px; cursor: pointer;
    background: transparent; color: #0ff; border: 2px solid #0ff; border-radius: 8px;
    box-shadow: 0 0 15px #0ff88, inset 0 0 15px #0ff33; transition: all .2s; }
  button:hover { background: #0ff22; box-shadow: 0 0 30px #0ff, inset 0 0 25px #0ff55; transform: scale(1.05); }
  #newRecord { display: none; color: #ffd700; text-shadow: 0 0 15px #ffd700; font-size: 22px; letter-spacing: 3px; margin-bottom: 18px; animation: blink .6s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .4; } }
  .float-label { position: fixed; pointer-events: none; color: #0ff; font-weight: bold; font-size: 20px;
    text-shadow: 0 0 10px #0ff; z-index: 15; animation: floatUp .7s ease-out forwards; }
  @keyframes floatUp {
    from { transform: translate(-50%, -50%); opacity: 1; }
    to { transform: translate(-50%, calc(-50% - 60px)); opacity: 0; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="topLeft">
    <div id="score">SCORE 0</div>
    <div class="miniRow"><span id="distStat">0 m</span><span id="orbStat">◆ 0</span></div>
  </div>

  <div id="panel">
    <div class="pTitle first">机 体 状 态</div>
    <div id="tierName">TIER 0 · 初始形态</div>
    <div class="barWrap"><div id="tierBar"></div></div>
    <div id="tierNext" class="tiny">下一形态 15 球</div>

    <div class="pTitle">能 力</div>
    <div class="ab locked" id="ab1"><i></i>横移强化</div>
    <div class="ab locked" id="ab2"><i></i>能量护盾<b id="shieldState"></b></div>
    <div class="ab locked" id="ab3"><i></i>磁力场</div>
    <div class="ab locked" id="ab4"><i></i>双倍得分</div>

    <div class="pTitle">数 据</div>
    <div class="drow"><span>速度</span><b><span id="speed">0</span> km/h</b></div>
    <div class="drow"><span>最高连击</span><b id="maxCombo">0</b></div>
    <div class="drow"><span>最佳纪录</span><b id="best">0</b></div>
  </div>

  <div id="comboBox"><span id="comboText"></span><div class="bar" id="comboBar"></div></div>
  <div id="toast"></div>
</div>
<div id="flash"></div>
<div id="vig"></div>

<div class="overlay" id="startScreen">
  <h1>NEON RACER</h1>
  <p class="sub">
    <b>← →</b> / <b>A D</b> 左右移动（按住连续滑动） &nbsp;&nbsp; <b>↑</b> / <b>空格</b> 跳跃<br>
    收集 <b style="color:#0ff">能量球</b> · 避开障碍 · 速度会越来越快<br>
    手机：按住左右半屏平移，轻点一下变一条道，上滑跳跃
  </p>

  <div id="newRecord">★ 新纪录 ★</div>
  <div class="final" id="finalScore">得分 0</div>
  <button id="restartBtn">再 来 一 局</button>
</div>

<div class="overlay hidden" id="pauseScreen">
  <h2 style="color:#0ff;text-shadow:0 0 20px #0ff">已 暂 停</h2>
  <p class="sub">按任意键或点击屏幕继续</p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const LANES = [-2.5, 0, 2.5];
const GRAVITY = -38, JUMP_V = 13;

let scene, camera, renderer, composer, clock;
let grid, ship, shipGlowMat;
let obstacles = [], orbs = [], pillars = [], particles = [], streaks = [];
let state = 'menu', paused = false;
let vy = 0, grounded = true;
let speed = 26, dist = 0, spawnDist = 0, orbCount = 0, elapsed = 0, score = 0;
let shakeTime = 0, best = +(localStorage.getItem('neonRacerBest') || 0);
let audioCtx = null;
let combo = 0, comboTimer = 0;
const COMBO_WINDOW = 2.5;
let streakTimer = 0, fovKick = 0;
let beatTimer = 0, beatGlow = 0, beatCount = 0, timeScale = 1, lastSpeedMark = 26, camRoll = 0;
let bloomPass = null, railMat = null;
let engineOsc = null, engineGain = null;
let overTimerId = null;
let shieldReady = false, invuln = 0, orbCountAtShieldEvent = 0;
let shockwaves = [];
const keys = { left: false, right: false };
const TRACK_HALF = 2.5;

const COMBO_COLORS = ['#00ffff', '#7fff00', '#ffee00', '#ff8800', '#ff22aa', '#ff2244'];
const TOASTS = { 5: '手感来了!', 10: '连击狂潮!', 15: '火力全开!', 20: '超神操作!', 30: '登峰造极!!' };

const $ = id => document.getElementById(id);
const scoreEl = $('score'), bestEl = $('best'), speedEl = $('speed');
const comboBox = $('comboBox'), comboText = $('comboText'), comboBar = $('comboBar'), toastEl = $('toast'), vig = $('vig');
const distStat = $('distStat'), orbStat = $('orbStat'), tierNameEl = $('tierName'),
  tierBar = $('tierBar'), tierNext = $('tierNext'), maxComboEl = $('maxCombo'),
  shieldState = $('shieldState'), abEls = [$('ab1'), $('ab2'), $('ab3'), $('ab4')];
const TIERS_UI = ['初始形态', '引擎过载', '能量护盾', '磁力场', '究极形态'];
const TIER_THRESHOLDS = [15, 35, 65, 100];
let maxCombo = 0;
bestEl.textContent = best;

function comboColor(mult) { return COMBO_COLORS[Math.min(COMBO_COLORS.length - 1, mult - 1)]; }
function multOf(c) { return Math.min(COMBO_COLORS.length, 1 + Math.floor(c / 4)); }

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05050f);
  scene.fog = new THREE.Fog(0x05050f, 30, 150);

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
  camera.position.set(0, 4.6, 8.5);
  camera.lookAt(0, 1, -12);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.6, 0.25);
  composer.addPass(bloomPass);

  scene.add(new THREE.AmbientLight(0x5566aa, 1.6));
  const dir = new THREE.DirectionalLight(0xffffff, 2);
  dir.position.set(3, 8, 4);
  scene.add(dir);

  grid = new THREE.GridHelper(400, 100, 0x00ffff, 0x004466);
  grid.material.transparent = true;
  grid.material.opacity = 0.85;
  scene.add(grid);

  railMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
  for (const x of [-5.4, 5.4]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 400), railMat);
    rail.position.set(x, 0.05, -150);
    scene.add(rail);
  }

  const starGeo = new THREE.BufferGeometry();
  const pos = [];
  for (let i = 0; i < 600; i++) {
    pos.push((Math.random() - 0.5) * 300, Math.random() * 80 + 10, -Math.random() * 250 - 20);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88ccff, size: 0.35, transparent: true, opacity: 0.7 })));

  buildShip();
}

function buildShip() {
  ship = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x14142a, metalness: 0.9, roughness: 0.25 });
  shipGlowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.7, 4), bodyMat);
  nose.rotation.x = -Math.PI / 2;
  ship.add(nose);

  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), shipGlowMat.clone());
  cockpit.material.color.set(0x66ffff);
  cockpit.position.set(0, 0.22, 0.1);
  ship.add(cockpit);

  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.09, 0.62), bodyMat);
  wing.position.y = -0.06;
  ship.add(wing);

  const tipMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
  const tips = [];
  for (const x of [-0.95, 0.95]) {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 0.66), tipMat);
    tip.position.set(x, -0.04, 0);
    ship.add(tip);
    tips.push(tip);
  }
  ship.userData.tips = tips;

  const flames = [];
  for (const x of [-0.32, 0.32]) {
    const engine = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), shipGlowMat);
    engine.position.set(x, 0, 0.82);
    ship.add(engine);
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.11, 1.1, 8), shipGlowMat.clone());
    flame.material.transparent = true; flame.material.opacity = 0.65;
    flame.rotation.x = -Math.PI / 2;
    flame.position.set(x, 0, 1.45);
    ship.add(flame);
    flames.push(flame);
  }
  ship.userData.flames = flames;
  ship.userData.cockpit = cockpit;
  const shieldBubble = new THREE.Mesh(
    new THREE.SphereGeometry(1.55, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
  );
  shieldBubble.visible = false;
  ship.add(shieldBubble);
  ship.userData.shieldBubble = shieldBubble;
  const aura = new THREE.Mesh(
    new THREE.TorusGeometry(1.3, 0.06, 8, 48),
    new THREE.MeshBasicMaterial({ color: 0x00ffff, fog: false })
  );
  aura.visible = false;
  ship.add(aura);
  ship.userData.aura = aura;
  ship.position.set(0, 0.95, 0);
  scene.add(ship);
}

const wallMat = new THREE.MeshBasicMaterial({ color: 0xff2255 });
const lowMat = new THREE.MeshBasicMaterial({ color: 0xff8800 });
const orbMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, fog: false });
const pillarMat = new THREE.MeshBasicMaterial({ color: 0x2244ff });
const streakMat = new THREE.MeshBasicMaterial({ color: 0x66ddff, transparent: true, opacity: 0.35, fog: false });

function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(90,255,255,0.55)');
  grad.addColorStop(1, 'rgba(0,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const orbHaloMat = new THREE.SpriteMaterial({ map: makeGlowTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });

function makeWall(lane, z) {
  const g = new THREE.Group();
  const w = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.2, 0.5), wallMat);
  w.position.y = 1.6;
  const e = new THREE.Mesh(new THREE.BoxGeometry(2.55, 3.35, 0.56),
    new THREE.MeshBasicMaterial({ color: 0xff2255, wireframe: true }));
  e.position.y = 1.6;
  g.add(w, e);
  g.position.set(LANES[lane], 0, z);
  g.userData = { type: 'wall', lane };
  return g;
}

function makeLow(lane, z) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.75, 0.5), lowMat);
  b.position.y = 0.38;
  const e = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.85, 0.55), new THREE.MeshBasicMaterial({ color: 0xff8800, wireframe: true }));
  e.position.y = 0.38;
  g.add(b, e);
  g.position.set(LANES[lane], 0, z);
  g.userData = { type: 'low', lane };
  return g;
}

function makeOrb(x, y, z) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 16), orbMat);
  const halo = new THREE.Sprite(orbHaloMat);
  halo.scale.set(1.9, 1.9, 1);
  m.add(halo);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.6, 0.05, 8, 26),
    new THREE.MeshBasicMaterial({ color: 0x00ffff, fog: false })
  );
  ring.rotation.x = Math.PI / 2;
  m.add(ring);
  m.userData = { baseY: y, phase: Math.random() * Math.PI * 2, ring };
  m.position.set(x, y, z);
  return m;
}

function makePillar(z) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 0.3), pillarMat);
  p.position.set(Math.random() < 0.5 ? -7.5 : 7.5, 2.5, z);
  return p;
}

function spawnPattern() {
  const roll = Math.random();
  if (roll < 0.18) {
    const lane = (Math.random() * 3) | 0;
    for (let i = 0; i < 5; i++) {
      const o = makeOrb(LANES[lane], 1.2, -140 - i * 2);
      orbs.push(o);
      scene.add(o);
    }
    return;
  }
  const freeLane = (Math.random() * 3) | 0;
  for (let lane = 0; lane < 3; lane++) {
    if (lane === freeLane) continue;
    if (Math.random() < 0.75) {
      const isLow = Math.random() < 0.4;
      const obj = isLow ? makeLow(lane, -140) : makeWall(lane, -140);
      obstacles.push(obj);
      scene.add(obj);
    } else if (Math.random() < 0.5) {
      const o = makeOrb(LANES[lane], 1.2, -140);
      orbs.push(o);
      scene.add(o);
    }
  }
  if (Math.random() < 0.6) {
    for (let i = 1; i <= 3 + ((Math.random() * 3) | 0); i++) {
      const o = makeOrb(LANES[freeLane], 1.2, -140 - i * 2);
      orbs.push(o);
      scene.add(o);
    }
  }
}

function burst(pos, color, size, maxLife, power, count = 140) {
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(count * 3), vel = [];
  for (let i = 0; i < count; i++) {
    posArr[i * 3] = pos.x; posArr[i * 3 + 1] = pos.y; posArr[i * 3 + 2] = pos.z;
    vel.push(new THREE.Vector3(
      (Math.random() - 0.5) * 16 * power,
      Math.random() * 12 * power + 2,
      (Math.random() - 0.5) * 16 * power
    ));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const mat = new THREE.PointsMaterial({ color, size, transparent: true, fog: false });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particles.push({ pts, vel, life: maxLife, maxLife });
}

function explode(pos) {
  burst(pos, 0xff5533, 0.45, 1.5, 1.5, 220);
  burst(pos, 0xffffff, 0.32, 0.5, 0.9, 70);
}

const shockGeo = new THREE.TorusGeometry(1, 0.05, 8, 48);
function spawnShockwave(pos, color, power = 1) {
  const m = new THREE.Mesh(shockGeo,
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, fog: false }));
  m.position.set(pos.x, Math.max(0.15, pos.y), pos.z);
  m.scale.setScalar(0.3);
  scene.add(m);
  shockwaves.push({ m, life: 0.6 * power, maxLife: 0.6 * power, power });
}

function shieldBreakFx() {
  spawnShockwave(ship.position, 0x00ffff, 1.2);
  spawnShockwave(ship.position, 0xffffff, 0.7);
  burst(ship.position, 0x00ffff, 0.26, 0.7, 1.2, 80);
  flash('#00ffff', 0.3, 400);
  toast('护盾破碎!', '#00ffff');
  shakeTime = Math.max(shakeTime, 0.4);
  beep(800, 0.2, 'sawtooth', 0.12);
  setTimeout(() => beep(400, 0.25, 'sawtooth', 0.1), 100);
}

function beep(freq, dur, type = 'square', vol = 0.15) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function crashSound() {
  if (!audioCtx) return;
  const len = audioCtx.sampleRate * 0.5;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = audioCtx.createBufferSource(); s.buffer = buf;
  const g = audioCtx.createGain(); g.gain.value = 0.4;
  s.connect(g); g.connect(audioCtx.destination); s.start();
}

function whoosh() {
  if (!audioCtx) return;
  const len = audioCtx.sampleRate * 0.22;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
  const s = audioCtx.createBufferSource();
  s.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.2;
  const g = audioCtx.createGain(); g.gain.value = 0.3;
  s.connect(f); f.connect(g); g.connect(audioCtx.destination);
  s.start();
}

function kick() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(42, audioCtx.currentTime + 0.12);
  g.gain.setValueAtTime(0.28, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.15);
}

function hat() {
  if (!audioCtx) return;
  const len = audioCtx.sampleRate * 0.04;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = audioCtx.createBufferSource();
  s.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 6500;
  const g = audioCtx.createGain(); g.gain.value = 0.055;
  s.connect(f); f.connect(g); g.connect(audioCtx.destination);
  s.start();
}

const BASS_LINE = [55, 55, 65.41, 49];
function scheduleBeat() {
  if (!audioCtx) { beatCount++; return; }
  kick();
  if (beatCount % 2 === 1) hat();
  if (beatCount % 4 === 0) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), fl = audioCtx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = BASS_LINE[(beatCount >> 2) % BASS_LINE.length];
    fl.type = 'lowpass'; fl.frequency.value = 320;
    g.gain.setValueAtTime(0.085, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.38);
    o.connect(fl); fl.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.4);
  }
  beatCount++;
}

function startEngine() {
  if (!audioCtx || engineOsc) return;
  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 300;
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 80;
  engineGain.gain.value = 0.02;
  engineOsc.connect(f); f.connect(engineGain); engineGain.connect(audioCtx.destination);
  engineOsc.start();
}

function stopEngine() {
  if (!engineOsc) return;
  const osc = engineOsc, gn = engineGain;
  try { gn.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.06); } catch (e) {}
  setTimeout(() => { try { osc.stop(); osc.disconnect(); } catch (e) {} }, 250);
  engineOsc = null; engineGain = null;
}

function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

const tmpV = new THREE.Vector3();
function floatLabel(text, worldPos, color = '#00ffff', size = 20) {
  tmpV.copy(worldPos).project(camera);
  if (tmpV.z > 1) return;
  const el = document.createElement('div');
  el.className = 'float-label';
  el.textContent = text;
  el.style.left = ((tmpV.x * 0.5 + 0.5) * innerWidth) + 'px';
  el.style.top = ((-tmpV.y * 0.5 + 0.5) * innerHeight) + 'px';
  el.style.color = color;
  el.style.textShadow = `0 0 10px ${color}`;
  el.style.fontSize = size + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 750);
}

function flash(color, strength, ms = 350) {
  const f = $('flash');
  f.style.background = color;
  f.style.transition = 'none';
  f.style.opacity = strength;
  setTimeout(() => { f.style.transition = `opacity ${ms}ms ease-out`; f.style.opacity = 0; }, 30);
}

function toast(text, color = '#ffd700') {
  toastEl.textContent = text;
  toastEl.style.color = color;
  toastEl.style.textShadow = `0 0 18px ${color}, 0 0 50px ${color}`;

  toastEl.classList.add('show');
}

const TIER_COLORS = [0x00ffff, 0x66ff22, 0xffee00, 0xff8822, 0xff22cc];
const TIER_NAMES = ['', '引擎过载 · 横移强化!', '能量护盾展开!', '磁力场激活!', '究极形态 · 双倍得分!!'];
const SHIELD_RECHARGE = 30;
let tier = 0;

function addScore(base) {
  const g = base * (tier >= 4 ? 2 : 1);
  score += g;
  return g;
}

function calcTier() {
  return orbCount >= 100 ? 4 : orbCount >= 65 ? 3 : orbCount >= 35 ? 2 : orbCount >= 15 ? 1 : 0;
}

function applyShipTier() {
  const c = TIER_COLORS[tier];
  shipGlowMat.color.setHex(c);
  ship.userData.cockpit.material.color.setHex(c).lerp(new THREE.Color(0xffffff), 0.35);
  for (const t of ship.userData.tips) t.material.color.setHex(c);
  const aura = ship.userData.aura;
  aura.visible = tier >= 2;
  aura.material.color.setHex(c);
  if (ship.userData.shieldBubble) ship.userData.shieldBubble.visible = tier >= 2 && shieldReady;
  if (scene && grid) {
    const tc = new THREE.Color(TIER_COLORS[tier]);
    grid.material.color.copy(tc).multiplyScalar(0.5);
    if (railMat) railMat.color.copy(tc).multiplyScalar(0.9);
    scene.background.copy(new THREE.Color(0x05050f)).lerp(tc, 0.05);
  }
}

function resetGame() {
  for (const o of [...obstacles, ...orbs, ...pillars, ...streaks]) scene.remove(o);
  for (const p of particles) scene.remove(p.pts);
  obstacles = []; orbs = []; pillars = []; particles = []; streaks = [];
  vy = 0; grounded = true;
  keys.left = keys.right = false;
  speed = 26; dist = 0; spawnDist = 0; orbCount = 0; elapsed = 0; shakeTime = 0;
  combo = 0; comboTimer = 0; score = 0; streakTimer = 0; fovKick = 0;
  beatTimer = 0; beatGlow = 0; timeScale = 1; lastSpeedMark = 26; camRoll = 0;
  shieldReady = false; invuln = 0; orbCountAtShieldEvent = 0;
  maxCombo = 0;
  for (const s of shockwaves) scene.remove(s.m);
  shockwaves = [];
  vig.style.opacity = 0;
  comboBox.style.opacity = 0;
  tier = 0;
  applyShipTier();
  camera.fov = 70;
  camera.updateProjectionMatrix();
  ship.position.set(0, 0.95, 0);
  ship.rotation.z = 0;
  ship.visible = true;
  updateHUD();
}

function startGame() {
  ensureAudio();
  if (overTimerId) { clearTimeout(overTimerId); overTimerId = null; }
  resetGame();
  beatCount = 0;
  startEngine();
  state = 'playing'; paused = false;
  $('startScreen').classList.add('hidden');
  $('overScreen').classList.add('hidden');
}

function gameOver() {
  state = 'over';
  crashSound();
  explode(ship.position);
  ship.visible = false;
  shakeTime = 0.9;
  flash('#ffffff', 0.5, 500);
  comboBox.style.opacity = 0;
  vig.style.opacity = 0;
  stopEngine();
  timeScale = 0.25;
  const sc = Math.floor(dist) + score;
  if (sc > best) {
    best = sc;
    localStorage.setItem('neonRacerBest', best);
    $('newRecord').style.display = 'block';
  } else {
    $('newRecord').style.display = 'none';
  }
  bestEl.textContent = best;
  $('finalScore').textContent = `得分 ${sc}`;
  overTimerId = setTimeout(() => {
    if (state === 'over') $('overScreen').classList.remove('hidden');
  }, 900);
}

function jump() {
  if (state !== 'playing' || paused || !grounded) return;
  vy = JUMP_V;
  grounded = false;
  ship.scale.set(0.8, 1.35, 0.8);
  beep(500, 0.15, 'sine', 0.1);
  setTimeout(() => beep(750, 0.12, 'sine', 0.08), 70);
}

function updateHUD() {
  scoreEl.textContent = 'SCORE ' + (Math.floor(dist) + score);
  speedEl.textContent = Math.round(speed * 3.6);
  distStat.textContent = Math.floor(dist) + ' m';
  orbStat.textContent = '◆ ' + orbCount;
  maxComboEl.textContent = '×' + multOf(Math.max(maxCombo, 1)) + ' · ' + maxCombo + ' 连';
  tierNameEl.textContent = 'TIER ' + tier + ' · ' + TIERS_UI[tier];
  tierNameEl.style.color = '#' + TIER_COLORS[tier].toString(16).padStart(6, '0');
  if (tier >= 4) {
    tierBar.style.width = '100%';
    tierNext.textContent = '已达最高形态';
  } else {
    const lo = tier === 0 ? 0 : TIER_THRESHOLDS[tier - 1];
    const hi = TIER_THRESHOLDS[tier];
    tierBar.style.width = Math.min(100, (orbCount - lo) / (hi - lo) * 100) + '%';
    tierNext.textContent = `下一形态 ${hi} 球`;
  }
  abEls.forEach((el, i) => {
    const active = tier >= i + 1;
    el.classList.toggle('locked', !active);
    el.classList.toggle('ready', active && i === 0 ? true : active && i === 1 ? shieldReady : false);
  });
  shieldState.textContent = tier < 2 ? '' : shieldReady ? '[就绪]' : `[充能 ${orbCount - orbCountAtShieldEvent}/${SHIELD_RECHARGE}]`;
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
    e.preventDefault();
    if (state === 'playing') jump();
    else startGame();
  } else if (e.code === 'Enter' && state !== 'playing') startGame();
});

addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

let touchDir = 0, touchStartY = null, touchStartTime = 0;
addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
  touchStartTime = performance.now();
  touchDir = e.touches[0].clientX < innerWidth / 2 ? -1 : 1;
}, { passive: true });
addEventListener('touchmove', e => {
  if (touchStartY !== null) touchDir = e.touches[0].clientX < innerWidth / 2 ? -1 : 1;
}, { passive: true });
addEventListener('touchend', e => {
  if (touchStartY === null) return;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const held = performance.now() - touchStartTime;
  if (dy < -40) jump();
  else if (held < 220 && state === 'playing') {
    ship.position.x += touchDir * 2.5;
    ship.position.x = Math.max(-TRACK_HALF, Math.min(TRACK_HALF, ship.position.x));
    beep(320, 0.08, 'triangle', 0.08);
  }
  touchDir = 0; touchStartY = null;
}, { passive: true });

$('startBtn').onclick = startGame;
$('restartBtn').onclick = startGame;

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') paused = true;
});
addEventListener('keydown', () => {
  if (paused && state === 'playing') { paused = false; $('pauseScreen').classList.add('hidden'); }
});
addEventListener('pointerdown', () => {
  if (paused && state === 'playing') { paused = false; $('pauseScreen').classList.add('hidden'); }
});

function showPaused() {
  $('pauseScreen').classList.remove('hidden');
}

initScene();
clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  grid.position.z = (grid.position.z + (state === 'playing' ? speed : 8) * dt) % 4;

  if (state === 'menu') {
    ship.position.x = Math.sin(t) * 2.5;
    ship.rotation.z = -Math.cos(t) * 0.35;
    ship.position.y = 0.95 + Math.sin(t * 3) * 0.1;
    camera.lookAt(ship.position.x * 0.4, 1, -12);
  }

  if (state === 'playing' && !paused) {
    elapsed += dt;
    speed = Math.min(72, 26 + elapsed * 0.55);
    const move = speed * dt;
    dist += move;
    spawnDist += move;

    const gap = Math.max(15, 26 - elapsed * 0.25);
    if (spawnDist >= gap) { spawnDist = 0; spawnPattern(); }

    if ((dist % 14) < move) {
      const p = makePillar(-150);
      pillars.push(p);
      scene.add(p);
    }

    let mv = 0;
    if (keys.left) mv -= 1;
    if (keys.right) mv += 1;
    if (touchDir !== 0) mv = touchDir;
    const latSpeed = (6 + speed * 0.33) * (1 + tier * 0.08);
    ship.position.x = Math.max(-TRACK_HALF, Math.min(TRACK_HALF, ship.position.x + mv * latSpeed * dt));
    const bankTarget = -mv * 0.4;
    ship.rotation.z += (bankTarget - ship.rotation.z) * Math.min(1, dt * 10);

    if (!grounded) {
      vy += GRAVITY * dt;
      ship.position.y += vy * dt;
      if (ship.position.y <= 0.95) {
        ship.position.y = 0.95; grounded = true; vy = 0;
        ship.scale.set(1.3, 0.65, 1.3);
        burst(new THREE.Vector3(ship.position.x, 0.25, 0.5), 0x66ccff, 0.16, 0.35, 0.4, 14);
        beep(170, 0.09, 'sine', 0.1);
        shakeTime = Math.max(shakeTime, 0.12);
      }
    } else {
      ship.position.y = 0.95 + Math.sin(t * 3.2) * 0.07;
    }
    ship.scale.x += (1 - ship.scale.x) * Math.min(1, dt * 9);
    ship.scale.y += (1 - ship.scale.y) * Math.min(1, dt * 9);
    ship.scale.z += (1 - ship.scale.z) * Math.min(1, dt * 9);

    if (invuln > 0) {
      invuln -= dt;
      ship.visible = Math.floor(t * 18) % 2 === 0;
      if (invuln <= 0) ship.visible = true;
    }

    for (let i = pillars.length - 1; i >= 0; i--) {
      pillars[i].position.z += move;
      if (pillars[i].position.z > 12) { scene.remove(pillars[i]); pillars.splice(i, 1); }
    }

    streakTimer -= dt;
    if (speed > 40 && streakTimer <= 0) {
      streakTimer = 0.05 + Math.random() * 0.07;
      const s = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 4 + Math.random() * 5), streakMat);
      s.position.set((Math.random() - 0.5) * 18, Math.random() * 7 + 0.5, -120);
      streaks.push(s);
      scene.add(s);
    }
    for (let i = streaks.length - 1; i >= 0; i--) {
      const st = streaks[i];
      st.position.z += move * 1.6;
      if (st.position.z > 12) { scene.remove(st); streaks.splice(i, 1); }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      const prevZ = o.position.z;
      o.position.z += move;
      if (o.position.z > 12) { scene.remove(o); obstacles.splice(i, 1); continue; }
      if (!o.userData.passed && prevZ <= 1.0 && o.position.z >= -1.0) {
        o.userData.passed = true;
        const dx = Math.abs(o.position.x - ship.position.x);
        const hitTop = o.userData.type === 'wall' ? 3.2 : 0.76;
        const bottom = ship.position.y - 0.35;
        const crashing = dx < 1.85 && bottom < hitTop;
        if (crashing && invuln <= 0) {
          if (shieldReady && tier >= 2) {
            shieldReady = false;
            orbCountAtShieldEvent = orbCount;
            invuln = 1.3;
            applyShipTier();
            shieldBreakFx();
          } else {
            gameOver();
            break;
          }
        }
        if (!crashing) {
          if (o.userData.type === 'low' && dx < 1.85 && !grounded) {
            const g = addScore(40);
            floatLabel('完美跳跃 +' + g, o.position, '#ffffff', 19);
            fovKick += 2.5;
            beep(1250, 0.14, 'sine', 0.12);
            burst(o.position, 0xffffff, 0.2, 0.4, 0.6, 22);
            scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
          } else if (dx >= 1.85 && dx < 3.6) {
            const g = addScore(30);
            floatLabel('擦身而过 +' + g, o.position, '#aaffff', 16);
            fovKick += 1.5;
            whoosh();
          }
        }
      }
    }

    if (combo > 0) {
      comboTimer -= dt;
      comboBar.style.width = Math.max(0, comboTimer / COMBO_WINDOW * 130) + 'px';
      if (comboTimer <= 0) {
        combo = 0;
        comboBox.style.opacity = 0;
        beep(300, 0.2, 'sawtooth', 0.05);
      }
    }

    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      const prevZ = o.position.z;
      o.position.z += move;
      o.position.y = o.userData.baseY + Math.sin(t * 4 + o.userData.phase) * 0.15;
      o.rotation.y += dt * 3;
      if (o.userData.ring) {
        o.userData.ring.rotation.x = t * 2 + o.userData.phase;
        o.userData.ring.rotation.y = Math.sin(t * 3 + o.userData.phase) * 0.6;
      }
      if (o.position.z > 10) { scene.remove(o); orbs.splice(i, 1); continue; }
      if (tier >= 3 && o.position.z < 4 && o.position.z > -16) {
        const md = Math.hypot(o.position.x - ship.position.x, o.userData.baseY - ship.position.y);
        if (md < 4.5) {
          const pull = Math.min(1, dt * 7);
          o.position.x += (ship.position.x - o.position.x) * pull;
          o.userData.baseY += (ship.position.y - o.userData.baseY) * pull;
        }
      }
      if (prevZ <= 1.15 && o.position.z >= -1.15 && Math.abs(o.position.x - ship.position.x) < 1.15
        && Math.abs(o.position.y - ship.position.y) < 1.25) {
        scene.remove(o); orbs.splice(i, 1);
        orbCount++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        comboTimer = COMBO_WINDOW;
        const mult = multOf(combo);
        const gainAmt = addScore(25 * mult);
        fovKick += 1.5;
        scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
        beep(700 + combo * 30, 0.09, 'square', 0.11);
        if (combo % 8 === 0) beep(1400 + combo * 15, 0.16, 'sawtooth', 0.06);
        burst(o.position, comboColor(mult), 0.18 + mult * 0.03, 0.5, 0.55, 14 + mult * 7);
        floatLabel('+' + gainAmt + (mult > 1 ? ' ×' + mult : ''), o.position, comboColor(mult), 17 + mult * 3);
        flash(comboColor(mult), mult >= 3 ? 0.13 : 0.06);
        comboText.textContent = '×' + mult + ' COMBO ' + combo;
        comboBox.style.color = comboColor(mult);
        comboBox.style.opacity = 1;
        comboBox.classList.remove('pop');
        void comboBox.offsetWidth;
        comboBox.classList.add('pop');
        if (TOASTS[combo]) toast(TOASTS[combo], comboColor(mult));
        if (tier >= 2 && !shieldReady && orbCount - orbCountAtShieldEvent >= SHIELD_RECHARGE) {
          shieldReady = true;
          applyShipTier();
          toast('护盾已充能', '#66ffff');
          beep(900, 0.12, 'triangle', 0.1);
          setTimeout(() => beep(1300, 0.15, 'triangle', 0.1), 90);
          spawnShockwave(ship.position, 0x00ffff, 0.6);
        }
        const nt = calcTier();
        if (nt > tier) {
          tier = nt;
          applyShipTier();
          if (tier >= 2 && !shieldReady) { shieldReady = true; orbCountAtShieldEvent = orbCount; }
          timeScale = 0.35;
          shakeTime = Math.max(shakeTime, 0.45);
          flash('#ffffff', 0.35, 550);
          toast(TIER_NAMES[tier], '#ffee00');
          spawnShockwave(ship.position, TIER_COLORS[tier], 1);
          setTimeout(() => { if (state === 'playing') spawnShockwave(ship.position, 0xffffff, 0.7); }, 130);
          for (let k = 0; k < 4; k++) {
            setTimeout(() => {
              burst(ship.position, k % 2 ? 0xffffff : TIER_COLORS[tier], 0.24, 0.9, 1.1, 50);
              if (k < 3) beep(520 + k * 260, 0.12, 'triangle', 0.13);
            }, k * 110);
          }
        }
        updateHUD();
      }
    }

    updateHUD();

    const bpm = 92 + speed * 1.15;
    beatTimer -= dt;
    if (beatTimer <= 0) {
      beatTimer = 60 / bpm;
      beatGlow = 1;
      scheduleBeat();
    }
    if (engineOsc) engineOsc.frequency.value = 46 + speed * 1.5 + combo * 2;

    if (speed - lastSpeedMark >= 10) {
      lastSpeedMark = speed;
      toast('速度提升!', '#ff8822');
      fovKick += 3;
      beep(500, 0.35, 'sawtooth', 0.07);
      setTimeout(() => beep(800, 0.3, 'sawtooth', 0.06), 120);
    }

    if (combo > 0) {
      vig.style.setProperty('--vc', comboColor(multOf(combo)));
      vig.style.opacity = Math.min(0.85, 0.18 + multOf(combo) * 0.07) * Math.max(0, comboTimer / COMBO_WINDOW);
    } else vig.style.opacity = 0;

    camera.position.x = ship.position.x * 0.35;
    camera.lookAt(ship.position.x * 0.5, 1, -12);
    camRoll += (-mv * 0.05 - camRoll) * Math.min(1, dt * 8);
    camera.rotation.z += camRoll;

    fovKick *= Math.exp(-dt * 5);
    camera.fov = 70 + ((speed - 26) / 46) * 12 + fovKick;
    camera.updateProjectionMatrix();

    const flamesArr = ship.userData.flames;
    if (flamesArr) {
      const fs = (1 + tier * 0.35) * (0.85 + (speed / 72) * 0.5) + Math.sin(t * 24) * 0.07;
      for (const f of flamesArr) f.scale.set(1 + tier * 0.15, fs, 1 + tier * 0.15);
    }
    const aura = ship.userData.aura;
    if (aura && aura.visible) {
      aura.rotation.x = Math.PI / 2 + Math.sin(t * 1.8) * 0.45;
      aura.rotation.y = t * 2.2;
      aura.scale.setScalar(1 + Math.sin(t * 6) * 0.08 + tier * 0.05);
    }
    const sb = ship.userData.shieldBubble;
    if (sb && sb.visible) {
      const p = 1 + Math.sin(t * 4) * 0.04 + (invuln > 0 ? Math.sin(t * 30) * 0.12 : 0);
      sb.scale.setScalar(p);
      sb.material.opacity = invuln > 0 ? 0.35 : 0.16;
    }
  }

  const pdt = dt * timeScale;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= pdt;
    const arr = p.pts.geometry.attributes.position.array;
    for (let j = 0; j < p.vel.length; j++) {
      p.vel[j].y -= 20 * pdt;
      arr[j * 3] += p.vel[j].x * pdt;
      arr[j * 3 + 1] = Math.max(0.05, arr[j * 3 + 1] + p.vel[j].y * pdt);
      arr[j * 3 + 2] += p.vel[j].z * pdt;
    }
    p.pts.geometry.attributes.position.needsUpdate = true;
    p.pts.material.opacity = Math.max(0, p.life / p.maxLife);
    if (p.life <= 0) { scene.remove(p.pts); particles.splice(i, 1); }
  }

  beatGlow *= Math.exp(-dt * 6);
  grid.material.opacity = 0.72 + beatGlow * 0.28;
  if (bloomPass) bloomPass.strength = 1.1 + beatGlow * 0.35;
  if (state === 'over') timeScale += (1 - timeScale) * dt * 2;

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.life -= pdt;
    const k = 1 - Math.max(0, s.life) / s.maxLife;
    s.m.scale.setScalar(0.3 + k * 9 * s.power);
    s.m.material.opacity = 0.9 * (1 - k);
    if (s.life <= 0) { scene.remove(s.m); s.m.material.dispose(); shockwaves.splice(i, 1); }
  }

  if (shakeTime > 0) {
    shakeTime -= dt;
    const s = shakeTime * 0.5;
    camera.position.x += (Math.random() - 0.5) * s;
    camera.position.y = 4.6 + (Math.random() - 0.5) * s;
  } else if (state !== 'playing') {
    camera.position.y = 4.6;
    camera.position.x *= 0.9;
  }

  if (paused && !showPending) { showPending = true; showPaused(); }
  if (!paused && showPending) { showPending = false; $('pauseScreen').classList.add('hidden'); }

  composer.render();
}

let showPending = false;

animate();
</script>
</body>
</html>
